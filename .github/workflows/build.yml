name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Kode Repository
      uses: actions/checkout@v4

    - name: 2. Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Generate Gradle Wrapper 8.2
      run: gradle wrapper --gradle-version 8.2 --distribution-type bin

    - name: 4. Build APK Debug
      run: ./gradlew assembleDebug

    - name: 5. Simpan File APK
      uses: actions/upload-artifact@v4
      with:
        name: KunciGameAnak-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
